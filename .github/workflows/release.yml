name: Release Babelfish bundle

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            platform: linux/amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm   # native arm64: the fork + extensions are too slow under QEMU
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - name: Build bundle
        run: ./build.sh ${{ matrix.platform }}   # clones the pinned fork + extensions commits
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir release && find artifacts -type f -exec mv {} release/ \;
          echo "Put these sha256 values in pg0/versions.env (BABELFISH_BUNDLE_SHA256_*):" > notes.md
          echo '```' >> notes.md; cat release/*.sha256 >> notes.md; echo '```' >> notes.md
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --notes-file notes.md release/*

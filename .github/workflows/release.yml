name: Release Babelfish bundle

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            platform: linux/amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm   # native arm64: the fork + extensions are too slow under QEMU
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
        with:
          path: babelfish_compiled
      - name: Load pins
        id: pins
        run: |
          set -a; source babelfish_compiled/versions.env; set +a
          for v in BABELFISH_PG_REPO BABELFISH_PG_REF BABELFISH_EXT_REPO BABELFISH_EXT_REF; do echo "$v=${!v}" >> $GITHUB_OUTPUT; done
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.BABELFISH_PG_REPO }}
          ref: ${{ steps.pins.outputs.BABELFISH_PG_REF }}
          path: postgresql_modified_for_babelfish
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.BABELFISH_EXT_REPO }}
          ref: ${{ steps.pins.outputs.BABELFISH_EXT_REF }}
          path: babelfish_extensions
      - name: Build bundle
        run: |
          # build.sh expects the three checkouts as siblings; the context is their parent dir.
          cp babelfish_compiled/.dockerignore .dockerignore 2>/dev/null || true
          ./babelfish_compiled/build.sh ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: babelfish_compiled/out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir release && find artifacts -type f -exec mv {} release/ \;
          echo "Put these sha256 values in pg0/versions.env (BABELFISH_BUNDLE_SHA256_*):" > notes.md
          echo '```' >> notes.md; cat release/*.sha256 >> notes.md; echo '```' >> notes.md
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --notes-file notes.md release/*
